<div class="container">
  <div class="header">
    <h1>🎮 Adivinhe a Palavra!</h1>
    <button class="btn-voltar" (click)="voltar()">← Voltar</button>
  </div>

  <div *ngIf="jogo">
    <div class="image-container">
      <img [src]="'data:image/jpeg;base64,' + imageBase64" alt="Imagem do desafio">
    </div>

    <!-- <div class="nivel-row">
      <span class="badge" [class]="'badge-' + (jogo.difficulty || 'EASY').toLowerCase()">
        {{ dificuldadeTexto }}
      </span>
      <button class="btn-audio" (click)="falar(dificuldadeTexto)">🔊</button>
    </div> -->

    <div *ngIf="mensagem && !sucesso" class="alert alert-error">{{ mensagem }}</div>

    <div class="form-section">
      <label>{{ jogo.difficulty === 'HARD' ? 'Forme a palavra (use ' + jogo.word.length + ' letras):' : 'Forme a palavra (use todas as letras):' }}</label>
      <div class="current-answer">{{ currentAnswer || '...' }}</div>

      <label>Letras embaralhadas:</label>
      <div class="scrambled-letters">
        <button *ngFor="let letra of shuffledLetters; let i = index"
                class="letter-button"
                [class.used]="usedIndexes.includes(i)"
                [disabled]="usedIndexes.includes(i) || sucesso"
                (click)="selecionarLetra(i)">
          {{ letra }}
        </button>
      </div>

      <div class="controls">
        <button class="btn-clear" [disabled]="sucesso" (click)="limpar()">Limpar</button>
        <button class="btn-enviar" [disabled]="!podeEnviar" (click)="enviar()">
          Enviar Resposta
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="sucesso">
    <div class="modal-vitoria">
      <div class="modal-emoji">🎉</div>
      <h2>Parabéns!</h2>
      <p>Você acertou a palavra!</p>
      <button class="btn-ok" (click)="voltar()">OK</button>
    </div>
  </div>
</div>
