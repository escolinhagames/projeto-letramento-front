<div class="container">
  <div class="header">
    <h1>👨‍🎓 Salas Disponíveis</h1>
    <button (click)="voltar()" class="btn-voltar">← Voltar</button>
  </div>

  <p *ngIf="carregando">Carregando salas...</p>
  <p *ngIf="!carregando && salas.length === 0" class="vazio">Nenhuma sala disponível no momento.</p>

  <div class="salas-grid" *ngIf="!carregando && salas.length > 0">
    <div class="sala-card" *ngFor="let sala de salas">
      <img [src]="'data:image/jpeg;base64,' + sala.imagem1" alt="Imagem" class="sala-imagem">
      <div class="sala-body">
        <!-- ✅ NOVO: nome do professor -->
        <h3>Prof. {{ sala.nomeProfessor }}</h3>
        <!-- ✅ NOVO: dificuldade com autofalante -->
        <div class="nivel-row">
          <span class="badge" [class]="'badge-' + sala.dificuldade?.toLowerCase()">
            {{ sala.dificuldade === 'FACIL' ? 'Fácil' : sala.dificuldade === 'MEDIO' ? 'Médio' : 'Difícil' }}
          </span>
          <button class="btn-audio" (click)="falarDificuldade(sala)">🔊</button>
        </div>
        <button (click)="entrar(sala.id)" class="btn-entrar">Entrar →</button>
      </div>
    </div>
  </div>
</div>
