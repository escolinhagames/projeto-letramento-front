<div class="container">
  <div class="header">
    <h1>🎲 Bingo Infantil</h1>
    <button class="btn-voltar" (click)="sair()">← Voltar</button>
  </div>

  <div *ngIf="mensagem" [class]="'alert alert-' + mensagemTipo">{{ mensagem }}</div>

  <!-- Entrar na Sala -->
  <div *ngIf="!entrou" class="section">
    <h2>Entrar na Sala</h2>
    <div class="form-group">
      <label>Código da sala:</label>
      <input type="text" [(ngModel)]="codigoSala" placeholder="Digite o código" maxlength="4">
    </div>
    <div class="form-group">
      <label>Seu nome:</label>
      <input type="text" [(ngModel)]="meuNome" placeholder="Digite seu nome">
    </div>
    <button class="btn-primary" (click)="entrarSala()">Entrar na Sala</button>
  </div>

  <!-- Jogo -->
  <div *ngIf="entrou">
    <div class="info-box">Sala: <strong>{{ codigoSala }}</strong></div>

    <h2 style="text-align:center">Número do Prof:</h2>
    <div class="numero-sorteado">{{ numeroDisplay }}</div>

    <div class="progress-bar">
      <div class="progress-fill" [style.width]="progresso + '%'">{{ progresso }}%</div>
    </div>
    <p style="text-align:center;color:#666;font-size:12px">{{ numerosMarcados.size }}/{{ cartela.length }} marcados</p>

    <h2 style="text-align:center;margin-top:20px">Sua Cartela</h2>
    <p style="text-align:center;color:#666;font-size:12px;margin-bottom:10px">Clique nos números para marcar</p>

    <div class="cartela">
      <div class="coluna" *ngFor="let col of cartelaGrid">
        <div *ngFor="let n of col"
             class="numero"
             [class.nao-sorteado]="!estaSorteado(n)"
             [class.marcado]="estaMarc(n)"
             [class.sorteado-nao-marcado]="estaSorteado(n) && !estaMarc(n)"
             (click)="marcar(n)">
          <div class="animal">{{ obterAnimal(n) }}</div>
          <div>{{ n }}</div>
        </div>
      </div>
    </div>

    <button class="btn-sair" (click)="sair()">Sair da Sala</button>
  </div>
</div>
