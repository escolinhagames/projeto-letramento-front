<div class="container">
  <div class="header">
    <h1>🎲 Bingo do Professor</h1>
    <button class="btn-voltar" (click)="voltar()">← Voltar</button>
  </div>

  <div *ngIf="mensagem" [class]="'alert alert-' + mensagemTipo">{{ mensagem }}</div>

  <!-- Criar Sala -->
  <div *ngIf="!salaCriada" class="section">
    <h2>1. Criar Sala</h2>
    <div class="form-group">
      <input type="text" [(ngModel)]="nomeProfessor" placeholder="Seu nome">
      <button class="btn-primary" (click)="criarSala()" [disabled]="criando">
        {{ criando ? 'Criando...' : 'Criar Sala' }}
      </button>
    </div>
  </div>

  <!-- Sala Criada -->
  <div *ngIf="salaCriada">
    <div class="info-box">
      <h3>Código da Sala:</h3>
      <div class="codigo">{{ codigoSala }}</div>
    </div>

    <!-- Cartela do Professor -->
    <div class="section" *ngIf="cartelaGrid.length > 0">
      <h2>Sua Cartela</h2>
      <div class="cartela">
        <div class="coluna" *ngFor="let col of cartelaGrid">
          <div class="numero-card" *ngFor="let n of col">
            <div class="animal">{{ obterAnimal(n) }}</div>
            <div>{{ n }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sortear -->
    <div class="section">
      <h2>2. Sortear</h2>
      <div class="numero-sorteado">{{ numeroDisplay }}</div>
      <button class="btn-sortear" (click)="sortear()">SORTEAR</button>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Sorteados</div>
          <div class="stat-value">{{ totalSorteados }}/50</div>
        </div>
        <div class="stat">
          <div class="stat-label">Alunos</div>
          <div class="stat-value">{{ totalAlunos }}</div>
        </div>
      </div>
      <div class="sorteados-list">
        <span class="numero-tag" *ngFor="let n of sorteados">{{ n }}</span>
      </div>
    </div>

    <!-- Alunos -->
    <div class="section">
      <h2>3. Alunos</h2>
      <div class="alunos-list">
        <p *ngIf="alunos.length === 0" class="vazio">Aguardando alunos...</p>
        <div class="aluno-item" *ngFor="let aluno of alunos">
          <span>{{ aluno }}</span>
          <span class="badge-bingo" *ngIf="alunosBingo[aluno]">🎉 BINGO!</span>
          <span *ngIf="!alunosBingo[aluno]">Jogando...</span>
        </div>
      </div>
    </div>

    <div class="acoes">
      <button class="btn-secondary" (click)="resetar()">Novo Jogo</button>
      <button class="btn-danger" (click)="encerrar()">Encerrar Sala</button>
    </div>
  </div>
</div>
