<div class="jogo-professor">
  <h1 class="jogo-professor__titulo">Configuração da rodada</h1>

  <div class="jogo-professor__dificuldade">
    <button
      type="button"
      class="jogo-professor__botao"
      [class.jogo-professor__botao--ativo]="dificuldadeAtual() === 'facil'"
      (click)="definirDificuldade('facil')"
    >
      Facil
    </button>

    <button
      type="button"
      class="jogo-professor__botao"
      [class.jogo-professor__botao--ativo]="dificuldadeAtual() === 'dificil'"
      (click)="definirDificuldade('dificil')"
    >
      Dificil
    </button>
  </div>

  <app-mapa-brasil [interativo]="false" />
</div>
