<div class="aluno-dashboard-container">
  <div class="header">
    <button class="back-btn" (click)="voltar()">← Voltar</button>
    <button class="btn-creditos" routerLink="/creditos">Créditos</button>
  </div>

  <h2>Escolha um Jogo para Jogar:</h2>

  <div class="games-grid">
    <div class="game-card" (click)="selecionarJogo(1)">
      <h3>🎲 Bingo</h3>
      <p>Jogo clássico de bingo com cartelas</p>
      <button class="btn-audio" (click)="falar('Bingo', $event)">🔊</button>
    </div>

    <div class="game-card" (click)="selecionarJogo(2)">
      <h3>🔤 Embaralhar</h3>
      <p>Adivinhe a palavra pela imagem</p>
      <button class="btn-audio" (click)="falar('Embaralhar', $event)">🔊</button>
    </div>

    <div class="game-card" (click)="selecionarJogo(3)">
      <h3>🧠 Memória</h3>
      <p>Encontre os pares corretos</p>
      <button class="btn-audio" (click)="falar('Jogo da Memória', $event)">🔊</button>
    </div>

    <div class="game-card" (click)="selecionarJogo(4)">
      <h3>🖼️ Acerte a letra</h3>
      <p>Adivinhe a imagem pela dica de letras</p>
      <button class="btn-audio" (click)="falar('Acerte a letra', $event)">🔊</button>
    </div>
  </div>
</div>
