<div class="container">



  <div class="box">
    <div class="top">
      <button class="back" (click)="voltar()" aria-label="Voltar">
        ⬅
      </button>
    </div>

    <h2>Cadastro</h2>

    <input
      type="text"
      placeholder="Nome"
      [(ngModel)]="nome"
    >

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Senha"
      [(ngModel)]="senha"
    >

    <input
      type="password"
      placeholder="Confirme sua senha"
      [(ngModel)]="confirmar"
    >

    <button class="save-button" (click)="salvar()">
      Salvar
    </button>

    <p *ngIf="erro" class="erro">
      {{ erro }}
    </p>

  </div>

</div>
